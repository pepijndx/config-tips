<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuratieoverzicht Tips</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      margin: 0;
    }
    .sidebar {
      width: 200px;
      background-color: #f2f2f2;
      padding: 1em;
      height: 100vh;
      box-shadow: inset -1px 0 0 #ccc;
    }
    .content {
      flex-grow: 1;
      padding: 2em;
    }
    .ad-box {
      background-color: #e0e0e0;
      padding: 1em;
      margin-bottom: 1em;
      text-align: center;
      font-size: 0.9em;
      color: #555;
    }
    h1, h2 {
      margin-top: 0;
    }
    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="ad-box">🔧 ohnee</div>
    <div class="ad-box">💾 uh ja?</div>
    <div class="ad-box">📊 Easing</div>
  </div>
  <div class="content">
    <h1>Em snelle test</h1>
  </div>
</body>
</html>
